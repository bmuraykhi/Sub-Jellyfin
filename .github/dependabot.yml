version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: nuget
    directories:
      - /
      - /tests/*
    schedule:
      interval: monthly
    ignore:
      - dependency-name: "Jellyfin.*"
    groups:
      nuget:
        patterns:
          - "*"
