name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.SeasonSubtitles.csproj

      - name: Build (Release)
        run: dotnet build Jellyfin.Plugin.SeasonSubtitles.csproj -c Release --no-restore

      - name: Test
        run: dotnet test tests/Jellyfin.Plugin.SeasonSubtitles.Tests/Jellyfin.Plugin.SeasonSubtitles.Tests.csproj -c Release

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install lint deps
        run: npm ci

      - name: Lint JS
        run: npx eslint .

      - name: Validate manifest.json + meta.json
        run: |
          for f in manifest.json meta.json; do
            python3 -c "import json,sys; json.load(open('$f'))" \
              && echo "$f: OK" \
              || (echo "$f: invalid JSON"; exit 1)
          done
