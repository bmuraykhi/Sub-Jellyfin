name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '9.0.x'

      - name: Resolve version from tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF##*/}"
          else
            TAG="v$(jq -r .version meta.json)"
          fi
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "Tag '$TAG' is not a plain numeric version tag" >&2
            exit 1
          fi
          dots=$(tr -cd '.' <<<"$VERSION" | wc -c)
          while [ "$dots" -lt 3 ]; do
            VERSION="${VERSION}.0"
            dots=$((dots + 1))
          done
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG  Version: $VERSION"

      - name: Sync meta.json to tag version
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          CHANGELOG="$(git log -1 --pretty=%s)"
          tmp=$(mktemp)
          jq --arg v "$VERSION" \
             --arg t "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
             --arg cl "$CHANGELOG" \
             '.version = $v | .timestamp = $t | .changelog = $cl' meta.json > "$tmp"
          mv "$tmp" meta.json

      - name: Build
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          dotnet publish Jellyfin.Plugin.SeasonSubtitles.csproj \
            -c Release -o publish \
            -p:Version="$VERSION" \
            -p:AssemblyVersion="$VERSION" \
            -p:FileVersion="$VERSION"

      - name: Stage artifacts and compute MD5
        id: pkg
        run: |
          mkdir -p artifacts
          cp publish/Jellyfin.Plugin.SeasonSubtitles.dll artifacts/
          cp meta.json artifacts/
          cp assets/icon.png artifacts/
          (cd artifacts && zip -q season-subtitle-downloader.zip Jellyfin.Plugin.SeasonSubtitles.dll meta.json icon.png)
          MD5=$(md5sum artifacts/season-subtitle-downloader.zip | awk '{print toupper($1)}')
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"
          echo "MD5: $MD5"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          files: |
            artifacts/Jellyfin.Plugin.SeasonSubtitles.dll
            artifacts/meta.json
            artifacts/season-subtitle-downloader.zip
          generate_release_notes: true

      - name: Checkout main
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          path: main
          fetch-depth: 0
          persist-credentials: true

      - name: Update manifest and meta on main
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ steps.ver.outputs.tag }}
          VERSION: ${{ steps.ver.outputs.version }}
          MD5: ${{ steps.pkg.outputs.md5 }}
          REPO: ${{ github.repository }}
        run: |
          cd main
          cp ../meta.json meta.json
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          SRC="https://github.com/${REPO}/releases/download/${TAG}/season-subtitle-downloader.zip"
          ABI="$(jq -r .targetAbi meta.json)"
          CHANGELOG="$(jq -r .changelog meta.json)"
          tmp=$(mktemp)
          jq --arg v   "$VERSION" \
             --arg cl  "$CHANGELOG" \
             --arg s   "$SRC" \
             --arg c   "$MD5" \
             --arg t   "$TS" \
             --arg abi "$ABI" \
             '.[0].versions |= ([{version:$v, changelog:$cl, targetAbi:$abi, sourceUrl:$s, checksum:$c, timestamp:$t}] + map(select(.version != $v)))' \
             manifest.json > "$tmp"
          mv "$tmp" manifest.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json meta.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(release): publish ${TAG} [skip ci]"
          for _ in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plugin
          path: artifacts/
